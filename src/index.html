<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
  <title>🏠 人脸识别门禁 · 流程图探究</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #fef9e7 0%, #e8f8f5 30%, #fdedec 60%, #eaf2f8 100%);
      background-attachment: fixed;
      font-family: 'Comic Sans MS', 'KaiTi', 'STKaiti', 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      margin: 0;
      font-size: 18px; /* 全局字体增大 */
    }
    .app-container {
      width: 100%;
      max-width: 1450px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 0 0 4px #ffeaa7, 0 0 0 8px rgba(255, 234, 167, 0.4);
      padding: 1.2rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    /* 顶部标题栏 */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 0 0.5rem;
    }
    .top-header h2 {
      font-size: 2.2rem; /* 增大标题 */
      margin: 0;
      color: #c44536;
      text-shadow: 2px 2px 0 #ffeaa7;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .status-message {
      font-weight: 600;
      color: #1e272e;
      background: #f0f0f0;
      padding: 0.6rem 1.6rem;
      border-radius: 3rem;
      font-size: 1.1rem; /* 增大状态文字 */
      border: 2px solid #b0bec5;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      flex: 1;
      text-align: center;
      min-width: 200px;
    }
    /* 主体区域 */
    .main-content {
      display: flex;
      gap: 1.5rem;
      flex: 1;
      min-height: 640px;
    }
    .flowchart-panel {
      flex: 3.5;
      background: #ffffff;
      border-radius: 2rem;
      border: 3px dashed #f9c74f;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: inset 0 0 30px rgba(249, 199, 79, 0.08);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 640px;
      background: #fffef9;
      border-radius: 1.2rem;
      touch-action: manipulation;
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
      border: 2px solid #fdcb6e;
      flex: 1;
    }
    .side-decision-btn {
      position: absolute;
      background: #ffeaa7;
      border: 3px solid #fdcb6e;
      color: #b83b3b;
      font-weight: 700;
      font-size: 1.2rem; /* 增大按钮字 */
      padding: 0.6rem 1.2rem;
      border-radius: 3rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 0 #c44536, 0 6px 12px rgba(0,0,0,0.1);
      transform: translateY(0);
      opacity: 0.7;
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      min-width: 50px;
      text-align: center;
      letter-spacing: 1px;
    }
    .side-decision-btn.active {
      background: #f6b092;
      border-color: #c44536;
      color: #ffffff;
      text-shadow: 1px 1px 0 #b83b3b;
      box-shadow: 0 4px 0 #b83b3b, 0 0 20px #f6b092;
      transform: translateY(-2px);
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      animation: bounceBtn 0.6s infinite alternate;
    }
    @keyframes bounceBtn {
      from { transform: translateY(-2px); }
      to { transform: translateY(2px); }
    }
    .side-decision-btn:active {
      transform: scale(0.94);
      box-shadow: 0 2px 0 #b83b3b;
    }
    #yesSideBtn {
      left: 32%;
      top: 46%;
    }
    #noSideBtn {
      right: 38%;
      top: 46%;
    }
    .drag-sidebar {
      flex: 1;
      background: #fffef5;
      border-radius: 2rem;
      border: 3px dashed #f6b092;
      padding: 0.8rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      box-shadow: inset 0 0 25px rgba(246,176,146,0.1);
      min-width: 220px;
      position: relative;
    }
    .sidebar-title {
      font-weight: 700;
      color: #c44536;
      text-align: center;
      font-size: 1.3rem; /* 增大 */
      background: #fff0ee;
      padding: 0.6rem;
      border-radius: 2rem;
      border: 2px solid #f6b092;
      letter-spacing: 1px;
      box-shadow: 0 3px 0 #f6b092;
      flex-shrink: 0;
    }
    #dragContainer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      width: 100%;
      align-items: center;
      padding: 5px 0;
    }
    .drag-block {
      cursor: grab;
      user-select: none;
      transition: all 0.15s ease;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,0.12));
      width: 100%;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .drag-block:active {
      cursor: grabbing;
      transform: scale(0.94);
    }
    .drag-block.dragging {
      opacity: 0.35;
      transform: rotate(3deg) scale(0.9);
    }
    .block-rect {
      width: 155px; /* 稍微加宽以容纳更大字体 */
      height: 54px;
      background: linear-gradient(180deg, #b9e6c9 0%, #84d19b 100%);
      border: 3px solid #1e7b4a;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem; /* 增大 */
      color: #0a3d1f;
      text-shadow: 0.5px 0.5px 0 white;
      box-shadow: 0 5px 0 #1e7b4a, 0 7px 14px rgba(30,123,74,0.25);
      text-align: center;
      padding: 0 8px;
      letter-spacing: 0.4px;
      position: relative;
    }
    
    .block-diamond {
      width: 140px;
      height: 78px;
      background: linear-gradient(180deg, #ffe9a7 0%, #fdcb6e 100%);
      border: 3px solid #c44536;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem; /* 增大 */
      color: #4a2411;
      text-shadow: 0.5px 0.5px 0 white;
      box-shadow: 0 6px 0 #c44536, 0 10px 20px rgba(196,69,54,0.3);
      position: relative;
    }
    .block-diamond span {
      display: block;
      width: 90px;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #4a2411;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .drag-hint {
      font-size: 0.85rem; /* 增大 */
      color: #636e72;
      text-align: center;
      font-style: italic;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    /* 底部工具栏 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      padding: 0.3rem 0;
    }
    .btn {
      border: none;
      background: transparent;
      padding: 0.75rem 1.8rem;
      font-weight: 700;
      font-size: 1.1rem; /* 增大按钮文字 */
      border-radius: 3rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 0.5px;
      font-family: inherit;
    }
    .btn-primary {
      background: #5a4ac9;
      color: white;
      box-shadow: 0 5px 0 #3c2e9e, 0 8px 18px rgba(90,74,201,0.3);
      border: 2px solid #9b8de0;
    }
    .btn-primary:hover {
      background: #6b5cdb;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #3c2e9e, 0 12px 24px rgba(90,74,201,0.4);
    }
    .btn-outline {
      background: #fff;
      border: 3px solid #5dade2;
      color: #1b4f72;
      box-shadow: 0 4px 0 #5dade2, 0 6px 14px rgba(93,173,226,0.25);
    }
    .btn-outline:hover {
      background: #eaf2f8;
      transform: translateY(-2px);
    }
    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.3);
      box-shadow: 0 3px 0 #aaa;
      transform: none;
    }
    @media (max-width: 900px) {
      .main-content {
        flex-direction: column;
        min-height: auto;
      }
      .flowchart-panel {
        flex: auto;
        min-height: 480px;
      }
      canvas {
        max-height: 480px;
      }
      #yesSideBtn { left: 25%; top: 45%; }
      #noSideBtn { right: 32%; top: 45%; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- 顶部标题和状态 -->
  <div class="top-header">
    <h2>🏠 人脸门禁流程</h2>
    <span class="status-message" id="statusDisplay"></span>
  </div>

  <!-- 主体：画布 + 积木区 -->
  <div class="main-content">
    <div class="flowchart-panel">
      <canvas id="flowchartCanvas" width="820" height="600"></canvas>
      <button class="side-decision-btn" id="yesSideBtn" disabled> 是</button>
      <button class="side-decision-btn" id="noSideBtn" disabled> 否</button>
    </div>

    <div class="drag-sidebar">
      <div class="sidebar-title">🧩 流程积木块</div>
      <div id="dragContainer"></div>
      <div class="drag-hint">✨ 拖到左边虚线框里吧 ✨</div>
    </div>
  </div>

  <!-- 底部按钮 -->
  <div class="toolbar">
    <button class="btn btn-primary" id="finishBtn">🎯 完成</button>
    <button class="btn btn-outline" id="testBtn" disabled>▶ 测试运行</button>
    <button class="btn btn-outline" id="resetBtn">🔄 重置</button>
  </div>
</div>

<script>
  (function() {
    const NODE_DEFS = [
      { id: 'start', type: 'start', label: '开始', x: 380, y: 38, fixed: true },
      { id: 'openCamera', type: 'process', label: '打开摄像头', x: 380, y: 108, required: true },
      { id: 'getFace', type: 'process', label: '获取人脸信息', x: 380, y: 178, required: true },
      { id: 'compare', type: 'process', label: '与业主信息做比对', x: 380, y: 248, required: true },
      { id: 'judge', type: 'decision', label: '判断是否是业主？', x: 380, y: 335, required: true },
      { id: 'welcome', type: 'process', label: '播报欢迎业主回家', x: 130, y: 400, required: true },
      { id: 'openDoor', type: 'process', label: '执行开门', x: 130, y: 472, required: true },
      { id: 'sorry', type: 'process', label: '播报对不起，您无权进入', x: 630, y: 440, required: true },
      { id: 'end', type: 'end', label: '结束', x: 380, y: 575, fixed: true }
    ];

    const nodesMap = new Map(NODE_DEFS.map(n => [n.id, n]));
    const REQUIRED_SLOTS = ['openCamera', 'getFace', 'compare', 'judge', 'welcome', 'openDoor', 'sorry'];

    let placedNodes = new Map();
    placedNodes.set('start', { ...nodesMap.get('start'), placed: true });
    placedNodes.set('end', { ...nodesMap.get('end'), placed: true });

    let simulationActive = false;
    let currentSimNodeId = null;
    let simulationTimer = null;

    const canvas = document.getElementById('flowchartCanvas');
    const ctx = canvas.getContext('2d');
    const finishBtn = document.getElementById('finishBtn');
    const testBtn = document.getElementById('testBtn');
    const resetBtn = document.getElementById('resetBtn');
    const yesSideBtn = document.getElementById('yesSideBtn');
    const noSideBtn = document.getElementById('noSideBtn');
    const statusDisplay = document.getElementById('statusDisplay');
    const dragContainer = document.getElementById('dragContainer');

    function getNodePos(id) {
      const placed = placedNodes.get(id);
      if (placed) return { x: placed.x, y: placed.y, type: placed.type };
      const def = nodesMap.get(id);
      return def ? { x: def.x, y: def.y, type: def.type } : null;
    }

    function drawFlowchart(highlightNodeId = null, decisionActive = false) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawAllConnections();
      for (let [id, node] of placedNodes.entries()) {
        drawNode(node, id === highlightNodeId, decisionActive && id === 'judge');
      }
      for (let slotId of REQUIRED_SLOTS) {
        if (!placedNodes.has(slotId)) {
          const def = nodesMap.get(slotId);
          if (def) drawPlaceholder(def);
        }
      }
    }

    function drawPlaceholder(nodeDef) {
      const { x, y, type } = nodeDef;
      ctx.save();
      ctx.strokeStyle = '#e67e22';
      ctx.lineWidth = 2.8;
      ctx.setLineDash([8, 6]);
      if (type === 'decision') {
        ctx.beginPath();
        const w = 140, h = 65;
        ctx.moveTo(x, y - h/2);
        ctx.lineTo(x + w/2, y);
        ctx.lineTo(x, y + h/2);
        ctx.lineTo(x - w/2, y);
        ctx.closePath();
        ctx.stroke();
      } else {
        roundedRect(ctx, x - 65, y - 21, 130, 42, 10);
        ctx.stroke();
      }
      ctx.restore();
      ctx.font = 'bold 16px "Comic Sans MS", "KaiTi", sans-serif';
      ctx.fillStyle = '#000000';
      ctx.textAlign = 'center';
      ctx.fillText(' 拖放到此', x, y + 5);
    }

    function drawNode(node, highlight, decisionGlow) {
      const { x, y, type, label } = node;
      ctx.save();
      if (type === 'start' || type === 'end') {
        roundedRect(ctx, x-50, y-19, 100, 38, 22);
        const grad = ctx.createLinearGradient(x-50, y-19, x+50, y+19);
        grad.addColorStop(0, '#b9a9f5');
        grad.addColorStop(1, '#7d6be0');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = highlight ? '#ffeaa7' : '#4a3db5';
        ctx.lineWidth = highlight ? 3.5 : 2.5;
        ctx.stroke();
      } else if (type === 'decision') {
        ctx.beginPath();
        const w = 140, h = 65;
        ctx.moveTo(x, y - h/2);
        ctx.lineTo(x + w/2, y);
        ctx.lineTo(x, y + h/2);
        ctx.lineTo(x - w/2, y);
        ctx.closePath();
        const grad = ctx.createLinearGradient(x-w/2, y-h/2, x+w/2, y+h/2);
        grad.addColorStop(0, decisionGlow ? '#ffeaa7' : '#fff3cd');
        grad.addColorStop(1, decisionGlow ? '#fdcb6e' : '#ffe69c');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = highlight ? '#c44536' : '#e67e22';
        ctx.lineWidth = highlight ? 3.5 : 2.5;
        ctx.stroke();
      } else {
        roundedRect(ctx, x-65, y-21, 130, 42, 10);
        const grad = ctx.createLinearGradient(x-65, y-21, x+65, y+21);
        grad.addColorStop(0, '#b9e6c9');
        grad.addColorStop(1, '#84d19b');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = highlight ? '#e53935' : '#27ae60';
        ctx.lineWidth = highlight ? 3.5 : 2.5;
        ctx.stroke();
      }
      ctx.restore();
      ctx.font = 'bold 16px "Comic Sans MS", "KaiTi", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#1a1a1a';
      ctx.shadowColor = 'white';
      ctx.shadowBlur = 4;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x, y);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }

    function roundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.lineTo(x+w-r, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r);
      ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h);
      ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r);
      ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath();
    }

    function drawAllConnections() {
      const edges = [
        { from: 'start', to: 'openCamera' },
        { from: 'openCamera', to: 'getFace' },
        { from: 'getFace', to: 'compare' },
        { from: 'compare', to: 'judge' },
        { from: 'judge', to: 'welcome', condition: 'yes' },
        { from: 'judge', to: 'sorry', condition: 'no' },
        { from: 'welcome', to: 'openDoor' },
        { from: 'openDoor', to: 'end', special: true },
        { from: 'sorry', to: 'end', special: true }
      ];

      ctx.save();
      ctx.strokeStyle = '#4a4a4a';
      ctx.lineWidth = 2.5;
      ctx.fillStyle = '#4a4a4a';

      for (let edge of edges) {
        const fromPos = getNodePos(edge.from);
        const toPos = getNodePos(edge.to);
        if (!fromPos || !toPos) continue;

        let startX, startY, endX, endY;
        if (fromPos.type === 'decision') {
          if (edge.condition === 'yes') {
            startX = fromPos.x - 70;
            startY = fromPos.y;
          } else {
            startX = fromPos.x + 70;
            startY = fromPos.y;
          }
        } else {
          startX = fromPos.x;
          startY = fromPos.y + 21;
        }

        if (toPos.type === 'decision') {
          endX = toPos.x;
          endY = toPos.y - 32;
        } else if (toPos.type === 'start' || toPos.type === 'end') {
          endX = toPos.x;
          endY = toPos.y - 19;
        } else {
          endX = toPos.x;
          endY = toPos.y - 21;
        }

        drawOrthogonalPath(ctx, startX, startY, endX, endY, edge);
      }
      ctx.restore();
    }

    function drawOrthogonalPath(ctx, x1, y1, x2, y2, edge) {
      ctx.beginPath();
      if (edge.special) {
        const midY = y2 - 15;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1, midY);
        ctx.lineTo(x2, midY);
        ctx.lineTo(x2, y2);
      } else if (edge.condition) {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y1);
        ctx.lineTo(x2, y2);
      } else if (Math.abs(x1 - x2) < 5) {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
      } else {
        const midY = (y1 + y2) / 2;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1, midY);
        ctx.lineTo(x2, midY);
        ctx.lineTo(x2, y2);
      }
      ctx.stroke();

      let arrowAngle;
      if (edge.special) {
        arrowAngle = Math.atan2(y2 - (y2 - 15), 0);
      } else if (edge.condition) {
        arrowAngle = Math.atan2(y2 - y1, 0);
      } else if (Math.abs(x1 - x2) < 5) {
        arrowAngle = Math.atan2(y2 - y1, 0);
      } else {
        arrowAngle = Math.atan2(y2 - (y1 + y2) / 2, 0);
      }
      const arrowX = x2 - Math.cos(arrowAngle) * 8;
      const arrowY = y2 - Math.sin(arrowAngle) * 8 + 6;
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(arrowX, arrowY);
      ctx.lineTo(arrowX - Math.cos(arrowAngle - 1.2) * 8, arrowY - Math.sin(arrowAngle - 1.2) * 8);
      ctx.lineTo(arrowX - Math.cos(arrowAngle + 1.2) * 8, arrowY - Math.sin(arrowAngle + 1.2) * 8);
      ctx.closePath();
      ctx.fill();
    }

    function createDragBlocks() {
      dragContainer.innerHTML = '';
      const blockDefs = [
        { id: 'openCamera', type: 'process', label: '打开摄像头' },
        { id: 'getFace', type: 'process', label: '获取人脸信息' },
        { id: 'compare', type: 'process', label: '与业主信息比对' },
        { id: 'judge', type: 'decision', label: '判断是否业主？' },
        { id: 'welcome', type: 'process', label: '播报欢迎回家' },
        { id: 'openDoor', type: 'process', label: '执行开门' },
        { id: 'sorry', type: 'process', label: '播报无权进入' }
      ];
      const shuffled = [...blockDefs].sort(() => Math.random() - 0.5);

      shuffled.forEach((def) => {
        const block = document.createElement('div');
        block.className = 'drag-block';
        block.setAttribute('draggable', 'true');
        block.dataset.block = def.id;
        if (def.type === 'decision') {
          block.innerHTML = `<div class="block-diamond"><span>${def.label}</span></div>`;
        } else {
          block.innerHTML = `<div class="block-rect">${def.label}</div>`;
        }
        block.addEventListener('dragstart', handleDragStart);
        block.addEventListener('dragend', handleDragEnd);
        dragContainer.appendChild(block);
      });
    }

    let draggedBlockId = null;
    function handleDragStart(e) {
      draggedBlockId = e.target.closest('.drag-block')?.dataset.block;
      if (draggedBlockId) {
        e.dataTransfer.setData('text/plain', draggedBlockId);
        e.target.closest('.drag-block').classList.add('dragging');
      }
    }
    function handleDragEnd(e) {
      const block = e.target.closest('.drag-block');
      if (block) block.classList.remove('dragging');
      draggedBlockId = null;
    }

    canvas.addEventListener('dragover', e => e.preventDefault());
    canvas.addEventListener('drop', function(e) {
      e.preventDefault();
      const blockId = e.dataTransfer.getData('text/plain');
      if (!blockId || !REQUIRED_SLOTS.includes(blockId)) return;
      if (placedNodes.has(blockId)) {
        updateStatus('⚠️ 这个积木已经放好啦');
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;
      const targetDef = nodesMap.get(blockId);
      const dist = Math.hypot(mouseX - targetDef.x, mouseY - targetDef.y);
      if (dist < 80) {
        placedNodes.set(blockId, { ...targetDef, placed: true });
        const blockElem = document.querySelector(`.drag-block[data-block="${blockId}"]`);
        if (blockElem) blockElem.remove();
        drawFlowchart();
        updateStatus(`✅ 太棒了！已放置：${targetDef.label.replace(/[^\u4e00-\u9fa5]/g,'')}`);
        checkAllPlaced();
      } else {
        updateStatus('❌ 再靠近虚线框一点哦~');
      }
    });

    function checkAllPlaced() {
      if (REQUIRED_SLOTS.every(id => placedNodes.has(id))) {
        updateStatus('🎉 所有积木都放好了！点击"完成"吧');
      }
    }

    function finishFlowchart() {
      if (!REQUIRED_SLOTS.every(id => placedNodes.has(id))) {
        alert('😊 请先把所有积木块拖到左边虚线位置哦~');
        return;
      }
      document.querySelectorAll('.drag-block').forEach(b => b.setAttribute('draggable', 'false'));
      finishBtn.disabled = true;
      testBtn.disabled = false;
      updateStatus('🔒 流程图已锁定，可以测试运行啦！');
    }

    function setDecisionButtonsEnabled(enabled) {
      if (enabled) {
        yesSideBtn.disabled = false;
        noSideBtn.disabled = false;
        yesSideBtn.classList.add('active');
        noSideBtn.classList.add('active');
      } else {
        yesSideBtn.disabled = true;
        noSideBtn.disabled = true;
        yesSideBtn.classList.remove('active');
        noSideBtn.classList.remove('active');
      }
    }

    function startSimulation() {
      if (simulationActive) return;
      simulationActive = true;
      testBtn.disabled = true;
      resetBtn.disabled = true;
      finishBtn.disabled = true;
      setDecisionButtonsEnabled(false);
      currentSimNodeId = 'openCamera';
      proceedSimulation();
    }

    function proceedSimulation() {
      if (!simulationActive || !currentSimNodeId) return;
      const node = placedNodes.get(currentSimNodeId);
      if (!node) { stopSimulation('流程中断'); return; }
      drawFlowchart(currentSimNodeId, false);
      if (node.type === 'decision') {
        setDecisionButtonsEnabled(true);
        updateStatus('🤔 判断框：请点击"是"或"否"');
        return;
      }
      setDecisionButtonsEnabled(false);
      updateStatus(`📍 正在执行：${node.label}`);
      simulationTimer = setTimeout(() => {
        if (!simulationActive) return;
        moveNext(currentSimNodeId);
      }, 1000);
    }

    function moveNext(currentId) {
      const nextMap = {
        'openCamera': 'getFace', 'getFace': 'compare', 'compare': 'judge',
        'welcome': 'openDoor', 'openDoor': 'end', 'sorry': 'end'
      };
      if (currentId === 'judge') return;
      const next = nextMap[currentId];
      if (next === 'end') {
        drawFlowchart('end');
        updateStatus('🏁 流程结束！');
        stopSimulation();
        return;
      }
      if (next && placedNodes.has(next)) {
        currentSimNodeId = next;
        proceedSimulation();
      } else stopSimulation('流程中断');
    }

    function handleDecision(choice) {
      if (!simulationActive || currentSimNodeId !== 'judge') return;
      setDecisionButtonsEnabled(false);
      if (choice === 'yes') {
        currentSimNodeId = 'welcome';
        updateStatus('✅ 是业主 → 欢迎回家！');
      } else {
        currentSimNodeId = 'sorry';
        updateStatus('❌ 非业主 → 无权进入');
      }
      drawFlowchart(currentSimNodeId);
      simulationTimer = setTimeout(() => {
        if (simulationActive) moveNext(currentSimNodeId);
      }, 800);
    }

    function stopSimulation(msg = '') {
      simulationActive = false;
      clearTimeout(simulationTimer);
      setDecisionButtonsEnabled(false);
      testBtn.disabled = false;
      resetBtn.disabled = false;
      finishBtn.disabled = true;
      currentSimNodeId = null;
      drawFlowchart();
      updateStatus(msg || '模拟结束');
    }

    function resetAll() {
      stopSimulation();
      placedNodes.clear();
      placedNodes.set('start', { ...nodesMap.get('start'), placed: true });
      placedNodes.set('end', { ...nodesMap.get('end'), placed: true });
      createDragBlocks();
      finishBtn.disabled = false;
      testBtn.disabled = true;
      setDecisionButtonsEnabled(false);
      updateStatus('🔄 已重置，重新来玩吧！');
      drawFlowchart();
    }

    function updateStatus(text) {
      statusDisplay.textContent = text ? '💬 ' + text : '';
    }

    finishBtn.addEventListener('click', finishFlowchart);
    testBtn.addEventListener('click', startSimulation);
    resetBtn.addEventListener('click', resetAll);
    yesSideBtn.addEventListener('click', () => handleDecision('yes'));
    noSideBtn.addEventListener('click', () => handleDecision('no'));

    createDragBlocks();
    setDecisionButtonsEnabled(false);
    drawFlowchart();
    // 初始状态不显示冗长提示，干净清爽
    updateStatus('');
  })();
</script>
</body>
</html>
